<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="fonts/CDOvuer-Regular.woff" as="font" type="font/woff" crossorigin />
    <link

      href="https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuI6fAZthiJ-Ek-_EeAmM.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuI6fAZ9hiJ-Ek-_EeA.woff2"

      type="font/woff2"
      crossorigin
    />

    <title>Концепты — Елена Лобанова</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/case.css" />
  </head>
  <body class="page page--case">
    <article class="case">
      <div class="case__inner">
        <header class="case__header">
          <a class="case__back" href="index.html">
            <img
              class="case__back-icon"
              src="images/cases/case-3/icon-arrow-left.svg"
              width="24"
              height="24"
              alt=""
            />
            <span class="case__back-text">Назад</span>
          </a>
          <h1 class="case__title">Концепты</h1>
        </header>

        <div class="case__content">
          <div class="case__intro">
            <p class="case__year">2025</p>
            <p class="case__text">
              Я люблю делать не&nbsp;только функциональные, но и красивые интерфейсы. В&nbsp;2025 году я&nbsp;закончила практический UI курс «Рисуем с Викой» от Sheeep, и&nbsp;по&nbsp;его результатам попала в ТОП-4 студентов. Здесь собраны мои концепты с&nbsp;курса
            </p>
          </div>

          <div class="case__gallery">
            <figure class="case__gallery-item">
              <img
                class="case__image case__image--concept"
                src="images/cases/case-3/concept-smart-home-7b37fb.png"
                width="682"
                height="384"
                alt="Приложение Умный дом"
              />
              <figcaption class="case__caption">Приложение Умный дом</figcaption>
            </figure>

            <figure class="case__gallery-item case__gallery-item--meetings">
              <img
                class="case__image case__image--meetings"
                src="images/cases/case-3/concept-meetings-3094da.png"
                width="682"
                height="599"
                alt="Сервис для планирования встреч"
              />
              <figcaption class="case__caption">Сервис для планирования встреч</figcaption>
            </figure>

            <figure class="case__gallery-item">
              <img
                class="case__image case__image--concept case__image--concept-tours"
                src="images/cases/case-3/concept-tours-301ba2.png"
                width="682"
                height="385"
                alt="Приложение для бронирования экскурсий"
              />
              <figcaption class="case__caption">Приложение для бронирования экскурсий</figcaption>
            </figure>
          </div>
        </div>

        <footer class="case__footer">
          <div class="case__footer-inner">
            <p class="case__footer-name">Елена Лобанова</p>
            <p class="case__footer-copy">© 2026</p>
          </div>
        </footer>
      </div>
    </article>
